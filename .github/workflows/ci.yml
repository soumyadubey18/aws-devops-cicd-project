name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::115253169449:role/GitHubActions-ECR-Deploy-Role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t aws-devops-cicd .

      - name: Tag Docker image
        run: |
          docker tag aws-devops-cicd:latest 115253169449.dkr.ecr.ap-south-1.amazonaws.com/aws-devops-cicd:latest

      - name: Push Docker image to ECR
        run: |
          docker push 115253169449.dkr.ecr.ap-south-1.amazonaws.com/aws-devops-cicd:latest
